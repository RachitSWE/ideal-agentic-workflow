name: Verify Ideal Agentic Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify:
    name: Citation Integrity & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin.json Schema & Syntax
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            if (!data.name || !data.version) {
              console.error('Invalid plugin.json: name or version missing');
              process.exit(1);
            }
            console.log('plugin.json validated successfully: ' + data.name + ' v' + data.version);
          "

      - name: Run Physical File Citation & Asset Verification Suite
        run: node scripts/verify-file-citations.js
